<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Experiencia AR</title>

  <!-- Versiones fijas: no las cambies sin probar, AR.js es sensible a esto -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background: transparent; }
    #aviso {
      position: fixed; left: 12px; right: 12px; bottom: 16px; z-index: 10;
      padding: 12px 16px; border-radius: 10px;
      background: rgba(140, 20, 20, .92); color: #fff;
      font-size: 16px; line-height: 1.35; text-align: center;
      transition: opacity .25s;
    }
    #aviso.oculto { opacity: 0; pointer-events: none; }
    #nombre {
      position: fixed; top: 14px; left: 12px; right: 12px; z-index: 10;
      text-align: center; color: #fff; font-size: 18px; font-weight: 600;
      text-shadow: 0 1px 4px rgba(0,0,0,.7); opacity: 0; transition: opacity .25s;
    }
    #nombre.visible { opacity: 1; }
    #error { display: none; position: fixed; inset: 0; z-index: 20; padding: 32px; color: #fff; background: #3a1d1d; font-size: 18px; }
  </style>
</head>
<body>
  <div id="nombre"></div>
  <div id="aviso" class="oculto"></div>
  <div id="error"></div>

  <script>
    function mostrarError(texto) {
      var e = document.getElementById('error');
      e.textContent = texto;
      e.style.display = 'block';
    }

    fetch('markers.json')
      .then(function (r) {
        if (!r.ok) throw new Error('No se encontró markers.json');
        return r.json();
      })
      .then(construirEscena)
      .catch(function (err) {
        mostrarError('No se pudo cargar la experiencia. Revisa markers.json. (' + err.message + ')');
      });

    function construirEscena(config) {
      if (config.titulo) document.title = config.titulo;

      var escena = document.createElement('a-scene');
      escena.setAttribute('embedded', '');
      escena.setAttribute('vr-mode-ui', 'enabled: false');
      escena.setAttribute('renderer', 'colorManagement: true; antialias: true;');
      escena.setAttribute('arjs', 'sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;');

      // Luces: la cámara es fija y el marcador se mueve, así que la luz llega
      // siempre desde el mismo lado. Una luz ambiente fuerte y dos direccionales
      // opuestas evitan que el modelo se vea oscuro según el ángulo.
      // Opcional: agrega "luz": 1.8 arriba en markers.json para más brillo.
      var luz = Number(config.luz) || 1.1;
      [
        ['type: ambient; intensity: ' + luz, null],
        ['type: directional; intensity: 0.35', '1 3 2'],
        ['type: directional; intensity: 0.25', '-1 -2 -2']
      ].forEach(function (l) {
        var e = document.createElement('a-entity');
        e.setAttribute('light', l[0]);
        if (l[1]) e.setAttribute('position', l[1]);
        escena.appendChild(e);
      });

      var aviso = document.getElementById('aviso');
      var etiqueta = document.getElementById('nombre');
      var visibles = 0;
      var archivos = [];

      (config.marcadores || []).forEach(function (m) {
        var marcador = document.createElement('a-marker');
        // Suavizado: reduce el temblor del modelo (sube smooth-count si aún vibra)
        marcador.setAttribute('smooth', 'true');
        marcador.setAttribute('smooth-count', '10');
        marcador.setAttribute('smooth-tolerance', '0.01');
        marcador.setAttribute('smooth-threshold', '5');

        if (m.tipo === 'barcode') {
          marcador.setAttribute('type', 'barcode');
          marcador.setAttribute('value', String(m.valor));
        } else {
          marcador.setAttribute('type', 'pattern');
          marcador.setAttribute('url', m.patron);
        }

        archivos.push(m.modelo);
        if (m.tipo !== 'barcode') archivos.push(m.patron);
        var modelo = document.createElement('a-entity');
        modelo.setAttribute('gltf-model', m.modelo);
        modelo.setAttribute('scale', m.escala || '1 1 1');
        modelo.setAttribute('position', m.posicion || '0 0 0');
        modelo.setAttribute('rotation', m.rotacion || '0 0 0');
        marcador.appendChild(modelo);

        marcador.addEventListener('markerFound', function () {
          visibles++;
          etiqueta.textContent = m.nombre || '';
          etiqueta.classList.add('visible');
        });
        marcador.addEventListener('markerLost', function () {
          visibles = Math.max(0, visibles - 1);
          if (visibles === 0) {
            etiqueta.classList.remove('visible');
          }
        });

        escena.appendChild(marcador);
      });

      // Prueba: abre el sitio con ?hiro al final del enlace y apunta al marcador Hiro (cubo rojo)
      if (location.search.indexOf('hiro') !== -1) {
        var h = document.createElement('a-marker');
        h.setAttribute('preset', 'hiro');
        var caja = document.createElement('a-box');
        caja.setAttribute('color', 'red');
        caja.setAttribute('position', '0 0.5 0');
        h.appendChild(caja);
        h.addEventListener('markerFound', function () { etiqueta.textContent = 'Hiro detectado'; etiqueta.classList.add('visible'); });
        h.addEventListener('markerLost', function () { etiqueta.classList.remove('visible'); });
        escena.appendChild(h);
      }

      var camara = document.createElement('a-entity');
      camara.setAttribute('camera', '');
      escena.appendChild(camara);

      document.body.appendChild(escena);

      // Solo avisa si falta algún archivo en el sitio
      Promise.all(archivos.map(function (a) {
        return fetch(a, { method: 'HEAD' }).then(function (r) { return r.ok ? null : a; }).catch(function () { return a; });
      })).then(function (faltan) {
        faltan = faltan.filter(Boolean);
        if (faltan.length) {
          aviso.textContent = 'Faltan archivos en el sitio: ' + faltan.join(', ');
          aviso.classList.remove('oculto');
        }
      });
    }
  </script>
</body>
</html>
