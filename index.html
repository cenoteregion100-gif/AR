<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Experiencia AR</title>

  <!-- Versiones fijas: no las cambies sin probar, AR.js es sensible a esto -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background: #111; }
    #aviso {
      position: fixed; left: 12px; right: 12px; bottom: 16px; z-index: 10;
      padding: 12px 16px; border-radius: 10px;
      background: rgba(20, 40, 28, .88); color: #f2f7f3;
      font-size: 16px; line-height: 1.35; text-align: center;
      transition: opacity .25s;
    }
    #aviso.oculto { opacity: 0; pointer-events: none; }
    #nombre {
      position: fixed; top: 14px; left: 12px; right: 12px; z-index: 10;
      text-align: center; color: #fff; font-size: 18px; font-weight: 600;
      text-shadow: 0 1px 4px rgba(0,0,0,.7); opacity: 0; transition: opacity .25s;
    }
    #nombre.visible { opacity: 1; }
    #error { display: none; position: fixed; inset: 0; z-index: 20; padding: 32px; color: #fff; background: #3a1d1d; font-size: 18px; }
  </style>
</head>
<body>
  <div id="nombre"></div>
  <div id="aviso">Permite el acceso a la cámara y apunta a un marcador de la instalación.</div>
  <div id="error"></div>

  <script>
    function mostrarError(texto) {
      var e = document.getElementById('error');
      e.textContent = texto;
      e.style.display = 'block';
    }

    fetch('markers.json')
      .then(function (r) {
        if (!r.ok) throw new Error('No se encontró markers.json');
        return r.json();
      })
      .then(construirEscena)
      .catch(function (err) {
        mostrarError('No se pudo cargar la experiencia. Revisa markers.json. (' + err.message + ')');
      });

    function construirEscena(config) {
      if (config.titulo) document.title = config.titulo;

      var escena = document.createElement('a-scene');
      escena.setAttribute('embedded', '');
      escena.setAttribute('vr-mode-ui', 'enabled: false');
      escena.setAttribute('renderer', 'logarithmicDepthBuffer: true; colorManagement: true; antialias: true;');
      escena.setAttribute('arjs', 'sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;');

      // Luces para que los modelos no se vean oscuros
      var ambiente = document.createElement('a-entity');
      ambiente.setAttribute('light', 'type: ambient; intensity: 1.1');
      escena.appendChild(ambiente);
      var sol = document.createElement('a-entity');
      sol.setAttribute('light', 'type: directional; intensity: 0.8');
      sol.setAttribute('position', '1 3 2');
      escena.appendChild(sol);

      var aviso = document.getElementById('aviso');
      var etiqueta = document.getElementById('nombre');
      var visibles = 0;

      (config.marcadores || []).forEach(function (m) {
        var marcador = document.createElement('a-marker');

        if (m.tipo === 'barcode') {
          marcador.setAttribute('type', 'barcode');
          marcador.setAttribute('value', String(m.valor));
        } else {
          marcador.setAttribute('type', 'pattern');
          marcador.setAttribute('url', m.patron);
        }

        var modelo = document.createElement('a-entity');
        modelo.setAttribute('gltf-model', m.modelo);
        modelo.setAttribute('scale', m.escala || '1 1 1');
        modelo.setAttribute('position', m.posicion || '0 0 0');
        modelo.setAttribute('rotation', m.rotacion || '0 0 0');
        marcador.appendChild(modelo);

        marcador.addEventListener('markerFound', function () {
          visibles++;
          aviso.classList.add('oculto');
          etiqueta.textContent = m.nombre || '';
          etiqueta.classList.add('visible');
        });
        marcador.addEventListener('markerLost', function () {
          visibles = Math.max(0, visibles - 1);
          if (visibles === 0) {
            aviso.classList.remove('oculto');
            etiqueta.classList.remove('visible');
          }
        });

        escena.appendChild(marcador);
      });

      var camara = document.createElement('a-entity');
      camara.setAttribute('camera', '');
      escena.appendChild(camara);

      document.body.appendChild(escena);
    }
  </script>
</body>
</html>
